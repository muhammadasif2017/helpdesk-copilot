[project]
name = "helpdesk-copilot"
version = "0.1.0"
description = "Helpdesk app with an embedded LLM support assistant (RAG, streaming, evals)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "openai>=1.55",
    "python-dotenv>=1.0",
    "fastembed>=0.4",
    "sqlite-vec>=0.1.6",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.28"]

[tool.uv]
package = false

[tool.pytest.ini_options]
markers = [
    "llm: hits a live LLM backend; slow on CPU-only machines (deselect with -m 'not llm')",
]
